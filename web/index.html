    <!--
      THESIS: A decision surface. It opens with what to do next and why, not with
      what happened, and refuses the analytics arrangement it replaces — a wall of
      KPI cards that reports numbers and leaves the reading to you.
      OWN-WORLD: Signal. Warm paper (#F7F5EF), near-black ink, one moss accent
      (#2C4A3B) meaning "working", one attention tone (#A8412B) meaning "do this
      next". Archivo throughout. Structure from rules, rows and dividers; no
      floating cards, no shadows, no dark chrome.
      STORY: The creator learns what to make next without reading a chart. The
      operator sees the machine is healthy in one line. Both can open the evidence.
      FIRST VIEWPORT: Light rail left. Today's read across the top on a moss tint
      with its confidence and sample beside it, the single best next move to its
      right. Three qualified metrics beneath, then ranked actions and system pulse.
      FORM: Signal, chosen by the user after Maison and two Codex mocks; the
      structure is Codex's, the palette and type are neither.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
