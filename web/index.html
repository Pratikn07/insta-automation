    <!--
      THESIS: A growth record, not a dashboard. It refuses the analytics-console
      arrangement — filled KPI cards over a gradient area chart — and sets measured
      figures as an editorial page where space and hairlines do the grouping.
      OWN-WORLD: Maison. Ivory ground (#F7F4EE), noir ink (#14120E), one thread of
      antique gold (#9C7C38 display / #8A6B2C text). Bodoni Moda display against Jost.
      No cards, no fills, no shadows; 1px hairlines and space only. Active route set
      in italic rather than highlighted.
      STORY: The creator sees what she gained and where from, and can act on it
      without knowing the machine. The operator sees the same truth, undiluted.
      FIRST VIEWPORT: Folio rule across the top. Headline left at 15ch. Beneath it
      the US figure in Bodoni at display scale with its counts alongside, the whole
      band closed by a hairline. Navigation is a bordered left column, unfilled.
      FORM: Maison, candidate 1 of the ordered list; brief-pinned by the user after
      two re-rolls (seed 112ceba3 superseded).
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md
    -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
